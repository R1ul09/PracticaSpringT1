<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Búsqueda Avanzada de Marcas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div th:replace="fragments/menu :: menuSuperior"></div>

    <div class="container mt-4">

        <h1 class="mb-4">Búsqueda Avanzada de Marcas</h1>

        <form th:action="@{/marcas/busquedaAvanzada}" method="get" class="row g-3 mb-5 p-3 border rounded shadow-sm">
            <div class="col-md-5">
                <label for="nombre" class="form-label">Nombre de la Marca:</label>
                <input type="text" class="form-control" id="nombre" name="nombre" th:value="${nombreMarca}"
                    placeholder="Ej. Toyota">
            </div>
            <div class="col-md-5">
                <label for="pais" class="form-label">País de Origen:</label>
                <input type="text" class="form-control" id="pais" name="pais" th:value="${paisOrigen}"
                    placeholder="Ej. Japón">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Buscar</button>
            </div>
        </form>

        <hr>

        <div th:fragment="alertas">
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>
        </div>

        <h2 th:if="${listaMarcas != null}" class="mt-4">Resultados de la Búsqueda</h2>

        <div th:if="${listaMarcas != null and !listaMarcas.empty}">
            <p class="text-success">Se encontraron **<span th:text="${listaMarcas.size()}"></span>** marcas que coinciden con la búsqueda.</p>
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>País Origen</th>
                        <th>Fundación</th>
                        <th>Modelos Activos</th>
                        <th>Detalles</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="marca : ${listaMarcas}">
                        <td th:text="${marca.id}"></td>
                        <td th:text="${marca.nombreMarca}"></td>
                        <td th:text="${marca.paisOrigen}"></td>
                        <td th:text="${#temporals.format(marca.fechaFundacion, 'dd/MM/yyyy')}"></td>
                        <td th:text="${marca.numModelosActivos}"></td>
                        <td>
                            <a th:href="@{/marcas/ver/{id}(id=${marca.id})}" class="btn btn-info btn-sm">Ver</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${listaMarcas != null and listaMarcas.empty}">
            <div class="alert alert-warning" role="alert">
                No se encontraron resultados para los criterios especificados.
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
