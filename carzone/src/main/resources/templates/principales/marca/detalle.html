<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ver Marca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>Detalles de la Marca</h1>

        <table class="table table-bordered table-striped" th:object="${marca}">
            <tbody>
                <tr>
                    <th scope="row">Nombre de la marca</th>
                    <td th:text="*{nombreMarca}"></td>
                </tr>
                <tr>
                    <th scope="row">Pais de Origen</th>
                    <td th:text="*{paisOrigen}"></td>
                </tr>
                <tr>
                    <th scope="row">Fecha de Fundacion</th>
                    <td th:text="*{fechaFundacion}"></td>
                </tr>
                <tr>
                    <th scope="row">Sede central</th>
                    <td th:text="*{sedeCentral}"></td>
                </tr>
                <tr>
                    <th scope="row">Numero de modelos Activos</th>
                    <td th:text="*{numModelosActivos}"></td>
                </tr>
            </tbody>
        </table>

        <h1>Detalles de los Coches Asociados</h1>

        <table class="table table-bordered table-striped" th:object="${coche}">

            <tbody>
                <tr>
                    <th scope="row">Modelo</th>
                    <!-- <td th:text="*{nombreMarca}"></td>-->
                </tr>
                <tr>
                    <th scope="row">Año</th>
                    <!-- <td th:text="*{paisOrigen}"></td>-->
                </tr>
                <tr>
                    <th scope="row">Precio</th>
                    <!-- <td th:text="*{fechaFundacion}"></td>-->
                </tr>
                <tr>
                    <th scope="row">Color</th>
                    <!-- <td th:text="*{sedeCentral}"></td>-->
                </tr>
                <tr>
                    <th scope="row">Tipo Combustible</th>
                    <!-- <td th:text="*{numModelosActivos}"></td>-->
                </tr>
            </tbody>
            
        </table>

        <a th:href="@{/marcas}" class="btn btn-secondary mt-3">Volver</a>
    
    </div>
</body>

</html>
