<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nueva Marca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>Añadir Nueva Marca</h1>
        <form th:action="@{/marcas/crear}" th:object="${marca}" method="post">
            <div class="mb-3">
                <label for="nombreMarca" class="form-label">Nombre de la marca</label>
                <input type="text" th:field="*{nombreMarca}" id="nombreMarca" class="form-control" placeholder="Nombre" required>
            </div>
            <div class="mb-3">
                <label for="paisOrigen" class="form-label">Pais</label>
                <input type="text" th:field="*{paisOrigen}" id="paisOrigen" class="form-control"
                    placeholder="pais" required>
            </div>
            <div class="mb-3">
                <label for="fechaFundacion" class="form-label">Fecha de fundacion</label>
                <input type="date" step="1" th:field="*{fechaFundacion}" id="fechaFundacion" class="form-control"
                    placeholder="fechaFundacion" required>
            </div>
            <div class="mb-3">
                <label for="sedeCentral" class="form-label">Sede Central</label>
                <input type="text" th:field="*{sedeCentral}" id="sedeCentral" class="form-control"
                    placeholder="sedeCentral" required>
            </div>
            <div class="mb-3">
                <label for="numModelosActivos" class="form-label">Numero de Modelos Activos</label>
                <input type="number" step="1" th:field="*{numModelosActivos}" id="numModelosActivos" class="form-control"
                    placeholder="numModelosActivos" required>
            </div>
            <button type="submit" class="btn btn-success">Guardar Marca</button>
            <a th:href="@{/marcas}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>

</html>
