<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Coche</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>Añadir Nuevo Coche</h1>
        <form th:action="@{/coches/crear}" th:object="${coche}" method="post">
            
            <div class="mb-3">
                <label for="modelo" class="form-label">Modelo</label>
                <input type="text" th:field="*{modelo}" id="modelo" class="form-control" placeholder="Ej: Serie 3" required>
            </div>
            <div class="mb-3">
                <label for="marca" class="form-label">Marca</label>
                <select th:field="*{marca}" id="marca" class="form-control" required>
                    <option value="">Seleccione una Marca</option>
                    <option th:each="marca : ${marcas}" th:value="${marca.id}" th:text="${marca.nombreMarca}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="anio" class="form-label">Año</label>
                <input type="number" step="1" th:field="*{anio}" id="anio" class="form-control" placeholder="Ej: 2023" required>
            </div>
            <div class="mb-3">
                <label for="color" class="form-label">Color</label>
                <input type="text" th:field="*{color}" id="color" class="form-control" placeholder="Ej: Rojo Pasión" required>
            </div>
            <div class="mb-3">
                <label for="tipoCombustible" class="form-label">Tipo de Combustible</label>
                <input type="text" th:field="*{tipoCombustible}" id="tipoCombustible" class="form-control" placeholder="Ej: Gasolina, Eléctrico, Híbrido" required>
            </div>
            <div class="mb-3">
                <label for="precio" class="form-label">Precio</label>
                <input type="number" step="0.01" th:field="*{precio}" id="precio" class="form-control" placeholder="Ej: 35000.50" required>
            </div>

            <button type="submit" class="btn btn-success">Guardar Coche</button>
            <a th:href="@{/coches}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>

</html>
