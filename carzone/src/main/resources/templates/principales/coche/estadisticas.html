<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Estadísticas de Coches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div th:replace="fragments/menu :: menuSuperior"></div>

    <div class="container mt-4">

        <h1 class="mb-5">Estadísticas y Operaciones Transaccionales</h1>

        <div th:if="${success}" class="alert alert-success" role="alert">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm border-primary">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Coche con el Precio Más Alto (TOP 1)</h5>
                    </div>
                    <div class="card-body" th:if="${cocheTopPrecio != null}">
                        <h4 class="card-title text-primary fw-bold" th:text="${cocheTopPrecio.modelo}"></h4>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">ID: <span th:text="${cocheTopPrecio.id}"></span></li>
                            <li class="list-group-item">Marca: <span th:text="${cocheTopPrecio.marca != null ? cocheTopPrecio.marca.nombreMarca : 'Sin Marca'}"></span></li>
                            <li class="list-group-item">Precio: **<span th:text="${#numbers.formatDecimal(cocheTopPrecio.precio, 0, 'POINT', 2, 'COMMA')}">€</span>**</li>
                        </ul>
                    </div>
                    <div class="card-body" th:unless="${cocheTopPrecio != null}">
                        <p class="text-danger">No hay coches registrados para calcular el top precio.</p>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow-sm border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Conteo de Coches por Modelo</h5>
                    </div>
                    <div class="card-body">
                        <p>El número total de coches registrados con el modelo <span th:text="${modeloEjemplo}"></span> es:</p>
                        <h2 class="display-4 text-success fw-bold" th:text="${countModelo}"></h2>
                    </div>
                </div>
            </div>
        </div>
        
        <hr class="my-5">

        <div class="card shadow border-danger mb-5">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Borrado Transaccional con Logging</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/coches/borrarPorAnio}" method="get" class="row g-3">
                    <div class="col-md-6">
                        <label for="anioBorrar" class="form-label">Eliminar coches con año mayor a (AAAA):</label>
                        <input type="number" class="form-control" id="anioBorrar" name="anio" 
                            placeholder="Ej. 2022" required>
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <button type="submit" class="btn btn-danger w-100" onclick="return confirm('ADVERTENCIA: ¿Estás seguro de que quieres ejecutar el borrado transaccional? ¡Esta acción es irreversible!');">
                            Ejecutar Borrado
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
