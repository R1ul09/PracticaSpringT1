<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Carzone</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-primary bg-gradient d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <!-- Logo -->
                        <div class="text-center mb-4">
                            <h1 class="fw-bold text-primary mb-2">
                                <i class="fas fa-car"></i> Carzone
                            </h1>
                            <p class="text-muted">Tu plataforma de gestión de coches</p>
                        </div>

                        <!-- Alert Logout -->
                        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="fas fa-check-circle"></i> Has cerrado sesión correctamente
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <p class="text-center text-muted mb-4">
                            Inicia sesión con tu cuenta para continuar
                        </p>

                        <a href="/oauth2/authorization/google" class="btn btn-outline-primary w-100 py-2 mb-3 fw-bold">
                            <i class="fab fa-google"></i> Inicia sesión con Google
                        </a>

                        <hr class="text-muted">

                        <p class="text-center text-muted small">
                            Al iniciar sesión, aceptas nuestros términos de servicio
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
