<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Rol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>Añadir Nuevo Rol</h1>
        <form th:action="@{/roles/crear}" th:object="${rol}" method="post">
            <div class="mb-3">
                <label for="nombreRol" class="form-label">Nombre del Rol</label>
                <input type="text" th:field="*{nombreRol}" id="nombreRol" class="form-control" placeholder="Ej: ADMIN o CLIENTE" required>
            </div>
            
            <button type="submit" class="btn btn-success">Guardar Rol</button>
            <a th:href="@{/roles}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>

</html>
