<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nueva Comparativa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>Añadir Nueva Comparativa</h1>
        <form th:action="@{/comparativas/crear}" th:object="${comparativa}" method="post">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" th:field="*{titulo}" id="titulo" class="form-control" placeholder="Ej: Comparativa de SUVs 2024" required>
            </div>
            <div class="mb-3">
                <label for="fechaCreacion" class="form-label">Fecha de Creación</label>
                <input type="date" th:field="*{fechaCreacion}" id="fechaCreacion" class="form-control"
                    placeholder="fechaCreacion" required>
            </div>

            <button type="submit" class="btn btn-success">Guardar Comparativa</button>
            <a th:href="@{/comparativas}" class="btn btn-secondary">Cancelar</a>
        </form>
        </div>
</body>

</html>
