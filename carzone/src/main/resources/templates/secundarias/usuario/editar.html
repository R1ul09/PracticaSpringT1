<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>Editar Usuario</h1>
        <form th:action="@{/usuarios/modificar}" th:object="${usuario}" method="post">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" id="nombre" class="form-control" placeholder="Nombre" required>
            </div>
            <div class="mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input type="text" th:field="*{apellidos}" id="apellidos" class="form-control" placeholder="Apellidos" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" th:field="*{email}" id="email" class="form-control" placeholder="email@ejemplo.com" required>
            </div>
            <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" th:field="*{contrasena}" id="contrasena" class="form-control" placeholder="Deja vacío para no cambiar" >
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="number" th:field="*{telefono}" id="telefono" class="form-control" placeholder="600123456" required>
            </div>
            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" th:field="*{direccion}" id="direccion" class="form-control" placeholder="C/ Falsa 123" required>
            </div>
            <div class="mb-3">
                <label for="rol" class="form-label">Rol</label>
                <select th:field="*{rol}" id="rol" class="form-control" required>
                    <option th:each="rol : ${roles}" th:value="${rol.id}" th:text="${rol.nombreRol}"></option>
                </select>
            </div>

            <input type="hidden" th:field="*{id}">
            <button type="submit" class="btn btn-success">Guardar Cambios</button>
            <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>

</html>
