<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>Editar Cita</h1>
        <form th:action="@{/citas/modificar}" th:object="${cita}" method="post">
            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha</label>
                <input type="date" th:field="*{fecha}" id="fecha" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="hora" class="form-label">Hora</label>
                <input type="time" th:field="*{hora}" id="hora" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="usuario" class="form-label">Usuario (Cliente)</label>
                <select th:field="*{usuario}" id="usuario" class="form-control" required>
                    <option th:each="usuario : ${usuarios}" th:value="${usuario.id}" th:text="${usuario.nombre + ' ' + usuario.apellidos}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="concesionario" class="form-label">Concesionario</label>
                <select th:field="*{concesionario}" id="concesionario" class="form-control" required>
                    <option th:each="concesionario : ${concesionarios}" th:value="${concesionario.id}" th:text="${concesionario.nombre}"></option>
                </select>
            </div>

            <input type="hidden" th:field="*{id}">
            <button type="submit" class="btn btn-success">Guardar Cambios</button>
            <a th:href="@{/citas}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>

</html>
