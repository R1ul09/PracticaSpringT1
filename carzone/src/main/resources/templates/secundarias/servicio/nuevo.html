<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Servicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>Añadir Nuevo Servicio</h1>
        <form th:action="@{/servicios/crear}" th:object="${servicio}" method="post">
            <div class="mb-3">
                <label for="nombreServicio" class="form-label">Nombre del Servicio</label>
                <input type="text" th:field="*{nombreServicio}" id="nombreServicio" class="form-control" placeholder="Ej: Revisión Completa" required>
            </div>
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea th:field="*{descripcion}" id="descripcion" class="form-control"
                    placeholder="Detalles del servicio..." rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label for="precioBase" class="form-label">Precio Base</label>
                <input type="number" step="0.01" th:field="*{precioBase}" id="precioBase" class="form-control"
                    placeholder="Ej: 99.99" required>
            </div>

            <button type="submit" class="btn btn-success">Guardar Servicio</button>
            <a th:href="@{/servicios}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>

</html>
