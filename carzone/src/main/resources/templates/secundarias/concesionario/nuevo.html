<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Concesionario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>Añadir Nuevo Concesionario</h1>
        <form th:action="@{/concesionarios/crear}" th:object="${concesionario}" method="post">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre del Concesionario</label>
                <input type="text" th:field="*{nombre}" id="nombre" class="form-control" placeholder="Nombre" required>
            </div>
            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" th:field="*{direccion}" id="direccion" class="form-control"
                    placeholder="Dirección completa" required>
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" th:field="*{telefono}" id="telefono" class="form-control"
                    placeholder="Teléfono de contacto" required>
            </div>
            
            <button type="submit" class="btn btn-success">Guardar Concesionario</button>
            <a th:href="@{/concesionarios}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>

</html>
